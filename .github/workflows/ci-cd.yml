name: CI/CD

on:
  push:
    branches: [ main, devoop-confirm ]
  pull_request:
    branches: [ main ]

jobs:
  backend-test:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11
        env:
          MYSQL_ROOT_PASSWORD: changeme_root
          MYSQL_DATABASE: e_utilities_cost
          MYSQL_USER: app_user
          MYSQL_PASSWORD: changeme
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mariadb-admin ping -h 127.0.0.1 -uroot -pchangeme_root --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=20
    defaults:
      run:
        working-directory: ./backend
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_NAME: e_utilities_cost
      DB_USER: app_user
      DB_PASSWORD: changeme
      JWT_SECRET: test_secret
      REFRESH_TOKEN_SECRET: test_refresh_secret
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run backend tests
        run: npm test

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

  docker-publish:
    needs: [backend-test, frontend-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          USERNAME=$(printf '%s' "${DOCKERHUB_USERNAME:-}" | tr -d '[:cntrl:]' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' -e 's/^["'\'']//' -e 's/["'\'']$//')
          TOKEN=$(printf '%s' "${DOCKERHUB_TOKEN:-}" | tr -d '[:cntrl:]' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' -e 's/^["'\'']//' -e 's/["'\'']$//')

          echo "username length=${#USERNAME} token length=${#TOKEN}"
          if [[ "$USERNAME" == *@* ]]; then
            echo "ERROR: DOCKERHUB_USERNAME is an email. Set it to the Docker Hub username (korarak777), not the email."
            exit 1
          fi
          if [[ "$USERNAME" == *:* ]]; then
            echo "ERROR: DOCKERHUB_USERNAME contains a colon, which breaks Basic auth."
            exit 1
          fi
          PREFIX=$(printf '%s' "$TOKEN" | cut -c1-9)
          echo "token prefix=${PREFIX}"
          if [[ "$PREFIX" != dckr_pat_ ]]; then
            echo "WARNING: token does not start with dckr_pat_. Use a Docker Hub Access Token, not the account password or a GitHub token."
          fi
          if [ -z "$USERNAME" ] || [ -z "$TOKEN" ]; then
            echo "DOCKERHUB_USERNAME or DOCKERHUB_TOKEN is empty after trimming."
            exit 1
          fi

          docker logout >/dev/null 2>&1 || true
          printf '%s' "$TOKEN" | docker login -u "$USERNAME" --password-stdin

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/e-utilities-cost-backend:latest

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/e-utilities-cost-frontend:latest
