name: CD

on:
  push:
    branches: [main]

env:
  BACKEND_IMAGE: confirm123/moew-data-888-backend
  FRONTEND_IMAGE: confirm123/moew-data-888-frontend
  DEPLOY_PATH: ~/apps/dawin
  API_URL: http://202.29.231.188:30050/api

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          USERNAME=$(printf '%s' "${DOCKERHUB_USERNAME:-}" | tr -d '[:cntrl:]' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' -e 's/^["'\'']//' -e 's/["'\'']$//')
          TOKEN=$(printf '%s' "${DOCKERHUB_TOKEN:-}" | tr -d '[:cntrl:]' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' -e 's/^["'\'']//' -e 's/["'\'']$//')

          echo "username length=${#USERNAME} token length=${#TOKEN}"
          if [[ "$USERNAME" == *@* ]]; then
            echo "ERROR: DOCKERHUB_USERNAME is an email. Set it to the Docker Hub username (confirm123), not the email."
            exit 1
          fi
          if [[ "$USERNAME" == *:* ]]; then
            echo "ERROR: DOCKERHUB_USERNAME contains a colon, which breaks Basic auth."
            exit 1
          fi
          PREFIX=$(printf '%s' "$TOKEN" | cut -c1-9)
          echo "token prefix=${PREFIX}"
          if [[ "$PREFIX" != dckr_pat_ ]]; then
            echo "WARNING: token does not start with dckr_pat_. Use a Docker Hub Access Token, not the account password or a GitHub token."
          fi
          if [ -z "$USERNAME" ] || [ -z "$TOKEN" ]; then
            echo "DOCKERHUB_USERNAME or DOCKERHUB_TOKEN is empty after trimming."
            exit 1
          fi

          docker logout >/dev/null 2>&1 || true
          printf '%s' "$TOKEN" | docker login -u "$USERNAME" --password-stdin

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ env.BACKEND_IMAGE }}:latest

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          no-cache: true
          build-args: |
            VITE_API_BASE_URL=${{ env.API_URL }}
          tags: ${{ env.FRONTEND_IMAGE }}:latest

      - name: Ensure deploy folder exists
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: mkdir -p ${{ env.DEPLOY_PATH }}

      - name: Copy compose file to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "docker-compose.yml"
          target: ${{ env.DEPLOY_PATH }}

      - name: Deploy app over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd ${{ env.DEPLOY_PATH }}

            cat > .env <<EOF
            DB_NAME=e_utilities_cost
            DB_USER=app_user
            DB_PASSWORD=${{ secrets.PROD_DB_PASSWORD }}
            DB_ROOT_PASSWORD=${{ secrets.PROD_DB_ROOT_PASSWORD }}
            JWT_SECRET=${{ secrets.PROD_JWT_SECRET }}
            JWT_EXPIRES_IN=1h
            REFRESH_TOKEN_SECRET=${{ secrets.PROD_REFRESH_TOKEN_SECRET }}
            REFRESH_TOKEN_EXPIRES_IN=7d
            FRONTEND_ORIGIN=http://202.29.231.188:30049
            DOCKERHUB_USERNAME=${{ secrets.DOCKERHUB_USERNAME }}
            EOF

            docker compose -f docker-compose.yml pull
            docker compose -f docker-compose.yml up -d --remove-orphans
            docker compose -f docker-compose.yml ps