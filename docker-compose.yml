services:
  mariadb:
    image: mariadb:11
    container_name: dawin-mariadb
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - dawin_mariadb_data:/var/lib/mysql
    networks:
      - dawin-net
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
    # ไม่ publish port ออกไป - เข้าถึงผ่าน network ภายในเท่านั้น

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: dawin-phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: mariadb
    depends_on:
      - mariadb
    networks:
      - dawin-net
    # ไม่ publish port ออกไป - ถ้าจะใช้ ให้ SSH tunnel เข้ามาแทน

  backend:
    build: ./backend
    image: ${DOCKERHUB_USERNAME}/moew-data-888-backend:latest
    container_name: dawin-backend
    restart: unless-stopped
    environment:
      DB_HOST: mariadb
      DB_PORT: 3306
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      PORT: 3000
      NODE_ENV: production
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1h}
      REFRESH_TOKEN_SECRET: ${REFRESH_TOKEN_SECRET}
      REFRESH_TOKEN_EXPIRES_IN: ${REFRESH_TOKEN_EXPIRES_IN:-7d}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN}
    ports:
      - "30050:3000"
    depends_on:
      mariadb:
        condition: service_healthy
    networks:
      - dawin-net

  frontend:
    build: ./frontend
    image: ${DOCKERHUB_USERNAME}/moew-data-888-frontend:latest
    container_name: dawin-frontend
    restart: unless-stopped
    ports:
      - "30049:80"
    depends_on:
      - backend
    networks:
      - dawin-net

networks:
  dawin-net:
    name: dawin-net

volumes:
  dawin_mariadb_data: